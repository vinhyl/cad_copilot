# Prompt 评测指令集（ADR-0002 D9）
# 三层标注说明见同目录 README.md。示例条目（source: example）不计入
# 30-50 条真实指令目标数，仅作格式参照；真实指令请按 draft -> annotated
# -> verified 流转补全。

instructions:
  # ---- 示例条目（格式参照） ------------------------------------------
  - id: "E001"
    source: example            # example | team
    status: annotated          # draft | annotated | verified
    instruction: "把这根轴换个大号的"
    target:
      part: "待标注（如 M4x8_Bolt / Shaft）"
      feature: "待标注（如 通孔 / 螺纹）"
    golden_trajectory:
      - tool: extract_properties
        note: "先定位目标零件并确认当前规格"
      - tool: pick_features
        note: "锁定目标特征（孔/轴）作为修改上下文"
      - tool: edit_geometry
        args:
          operation: drill      # 或具体替换操作
          approx: true
        note: "按标准件规格表选型（如 M8 -> M10），参数由选型表决定"
    assertions:
      - type: feature_measure
        check: "目标孔/轴直径从 8mm 变为 10mm（容差 ±0.01）"
      - type: invariant
        check: "其余特征拓扑不变"

  - id: "E002"
    source: example
    status: annotated
    instruction: "让这里更结实一点"
    target:
      part: "待标注（如 BasePlate）"
      feature: "待标注（如 侧壁 / 薄壁区域）"
    golden_trajectory:
      - tool: extract_properties
        note: "当前壁厚/体积基线"
      - tool: edit_geometry
        args:
          approx: true
        note: "预期生成 2-3 个预设方案（加厚/加强筋/换材料），用户点选后执行"
    assertions:
      - type: volume_delta
        check: "体积增加量落在所选方案的声明范围内"
      - type: dfm
        check: "壁厚不低于 DFM 最小值（如 1mm）"

  # ---- 真实指令（Phase C 开发中验证过的场景，断言机器可执行） ----------
  - id: "E003"
    source: team
    status: verified
    instruction: "给这根螺栓钻一个 R1 深 4 的通孔"
    target:
      part: "M4x8_Bolt"
      feature: "（新增特征）"
    golden_trajectory:
      - tool: parse_assembly
        args: {}
      - tool: edit
        args:
          template_id: "t1"
          operation: "drill"
          params: {radius: 1.0, depth: 4.0, position: [0, 0, 0]}
    assertions:
      - type: volume_delta
        expect_min: 10.0        # pi*1^2*4 ~= 12.57
        expect_max: 14.0

  - id: "E004"
    source: team
    status: verified
    instruction: "把底板放大到 2.5 倍"
    target:
      part: "BasePlate"
      feature: "（整体缩放）"
    golden_trajectory:
      - tool: parse_assembly
        args: {}
      - tool: edit
        args:
          template_id: "t0"
          operation: "scale"
          params: {factor: 2.5}
    assertions:
      - type: interference_rejected
        expect_count: 2         # 与两个螺栓实例都穿透（E2E 实测 94.248 mm3 x2）

  # ---- 真实指令收集区（从 draft 开始，随手记原话） --------------------
  # - id: "R001"
  #   source: team
  #   status: draft
  #   instruction: "<原话>"

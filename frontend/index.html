<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD Copilot</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>CAD Copilot</h1>
        <form id="load-form">
          <input id="path-input" placeholder="装配体 STEP 路径（服务端可见）" autocomplete="off" />
          <label class="force-row" title="忽略缓存键，强制重新解析并重建缓存">
            <input type="checkbox" id="force" /> 强制重建缓存
          </label>
          <button type="submit" id="load-btn">加载</button>
        </form>
        <div id="status" class="idle">输入路径并加载</div>
        <div id="tree"></div>
        <div id="edit-panel" class="hidden">
          <div class="fp-head">
            <span id="ep-title">编辑</span>
            <button id="ep-close" title="关闭">×</button>
          </div>
          <div class="ep-body">
            <div class="ep-row">
              <label>操作</label>
              <select id="ep-op">
                <option value="drill">钻孔</option>
                <option value="chamfer">倒角</option>
                <option value="fillet">圆角</option>
                <option value="scale">缩放</option>
              </select>
            </div>
            <div class="ep-row" id="ep-drill-params">
              <label>位置 x,y,z</label>
              <input id="ep-pos" value="0,0,0" />
              <label>半径 R</label>
              <input id="ep-radius" type="number" value="1" min="0.01" step="0.1" />
              <label>深度</label>
              <input id="ep-depth" type="number" value="4" min="0.01" step="0.5" />
            </div>
            <div class="ep-row hidden" id="ep-chamfer-params">
              <label>距离</label>
              <input id="ep-distance" type="number" value="0.2" min="0.01" step="0.1" />
            </div>
            <div class="ep-row hidden" id="ep-fillet-params">
              <label>半径</label>
              <input id="ep-fradius" type="number" value="0.2" min="0.01" step="0.1" />
            </div>
            <div class="ep-row hidden" id="ep-scale-params">
              <label>系数</label>
              <input id="ep-factor" type="number" value="1.5" min="0.01" step="0.1" />
            </div>
            <button id="ep-run">执行修改（干涉守门）</button>
            <div id="ep-msg" class="hidden"></div>
          </div>
        </div>
        <div id="version-panel" class="hidden">
          <div class="fp-head">
            <span>版本历史</span>
            <button id="vp-refresh" title="刷新">↻</button>
          </div>
          <div id="vp-list"></div>
        </div>
        <div id="feature-panel" class="hidden">
          <div class="fp-head">
            <span id="fp-title">特征</span>
            <button id="fp-close" title="关闭">×</button>
          </div>
          <div id="fp-list"></div>
        </div>
      </aside>
      <main id="viewport">
        <div id="toolbar">
          <div class="tb-group" title="多层级爆炸：拖动改变爆炸比例">
            <span class="tb-label">爆炸</span>
            <input type="range" id="explode-slider" min="0" max="100" value="0" />
            <span class="tb-value" id="explode-val">0%</span>
          </div>
          <div class="tb-group">
            <button id="btn-xray" title="透明鬼影模式（X 光）">X 光</button>
            <button id="btn-isolate" title="只显示选中节点，其余隐藏">隔离</button>
            <button id="btn-move" title="拖拽移动选中节点（临时，不落盘）">移动</button>
            <button id="btn-reset-moves" title="复位全部临时移动">复位移动</button>
          </div>
          <div class="tb-group" title="Z 轴剖切面">
            <label class="tb-toggle"><input type="checkbox" id="section-on" /> 剖切</label>
            <input type="range" id="section-slider" min="0" max="100" value="100" />
          </div>
          <div class="tb-group">
            <button id="btn-audit" title="一键体检：干涉 + DFM 可制造性检查">体检</button>
            <button id="btn-drawing" title="导入 DXF/DWG 图纸对照（D5）">图纸</button>
            <button id="btn-cam-save" title="保存当前视角">存视角</button>
            <button id="btn-cam-restore" title="恢复已存视角">回视角</button>
            <button id="btn-view-reset" title="复位视图（爆炸/显隐/临时移动/相机）">复位视图</button>
          </div>
        </div>
      </main>
      <div id="audit-modal" class="hidden">
        <div id="audit-card">
          <div class="fp-head">
            <span>体检报告</span>
            <button id="audit-close" title="关闭">×</button>
          </div>
          <div id="audit-body"></div>
        </div>
      </div>
      <div id="drawing-modal" class="hidden">
        <div id="drawing-card">
          <div class="fp-head">
            <span>图纸对照</span>
            <button id="drawing-close" title="关闭">×</button>
          </div>
          <div id="drawing-body">
            <div id="drawing-form">
              <input id="drawing-path" placeholder="DXF / DWG 路径（服务端可见）" />
              <button id="drawing-load">导入</button>
              <span id="drawing-msg"></span>
            </div>
            <div id="drawing-split">
              <div id="drawing-view"></div>
              <div id="drawing-semantics"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

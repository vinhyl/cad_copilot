<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD Copilot · 首页</title>
    <script type="module" crossorigin src="/app/assets/index-BuCWfeKk.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/utils-DHceTbdw.js">
    <link rel="modulepreload" crossorigin href="/app/assets/tree-5a9XzaHv.js">
    <link rel="stylesheet" crossorigin href="/app/assets/utils-C4g4V-ef.css">
  </head>
  <body>
    <div id="app" class="page-home">
      <aside id="sidebar" class="sidebar-left">
        <div class="sb-head">
          <h1>CAD Copilot</h1>
          <div class="sb-tabs">
            <button class="sb-tab active" data-tab="tree">装配</button>
            <button class="sb-tab" data-tab="plugins">插件</button>
          </div>
        </div>
        <div class="sb-tab-body" data-body="tree">
          <div id="load-form">
            <button type="button" id="btn-browse" title="从本机任意位置选择文件（STEP / DXF / DWG），也可直接拖入窗口">打开文件…</button>
            <label class="force-row" title="忽略缓存键，强制重新解析并重建缓存">
              <input type="checkbox" id="force" /> 强制重建缓存
            </label>
            <input type="file" id="file-input" accept=".step,.stp,.dxf,.dwg" hidden />
          </div>
          <div id="status" class="idle">浏览或拖入文件加载（STEP / DXF / DWG）</div>
          <div id="recent-panel" class="hidden">
            <div class="fp-head">
              <span>最近使用</span>
              <button id="recent-clear" title="清空记录">×</button>
            </div>
            <div id="recent-list"></div>
          </div>
          <div id="tree"></div>
        </div>
        <div class="sb-tab-body hidden" data-body="plugins">
          <div class="fp-head">
            <span>插件状态</span>
            <button id="plug-refresh" title="重新探测">↻</button>
          </div>
          <div id="plugin-list"></div>
        </div>
      </aside>

      <main id="viewport">
        <div id="toolbar">
          <div class="tb-group" title="多层级爆炸：拖动改变爆炸比例">
            <span class="tb-label">爆炸</span>
            <input type="range" id="explode-slider" min="0" max="100" value="0" />
            <span class="tb-value" id="explode-val">0%</span>
          </div>
          <div class="tb-group">
            <button id="btn-xray" title="透明鬼影模式（X 光）">X 光</button>
            <button id="btn-isolate" title="只显示选中节点，其余隐藏">隔离</button>
            <button id="btn-move" title="拖拽移动选中节点（临时，不落盘）">移动</button>
            <button id="btn-reset-moves" title="复位全部临时移动">复位移动</button>
          </div>
          <div class="tb-group" title="Z 轴剖切面">
            <label class="tb-toggle"><input type="checkbox" id="section-on" /> 剖切</label>
            <input type="range" id="section-slider" min="0" max="100" value="100" />
          </div>
          <div class="tb-group">
            <button id="btn-cam-save" title="保存当前视角">存视角</button>
            <button id="btn-cam-restore" title="恢复已存视角">回视角</button>
            <button id="btn-view-reset" title="复位视图（爆炸/显隐/临时移动/相机）">复位视图</button>
          </div>
        </div>
        <div id="ctx-bar" class="ctx-bar">
          <div id="ctx-actions" class="ctx-actions"></div>
          <div class="entry-cards">
            <button class="entry-card" id="entry-edit" title="进入编辑会话（草稿 + 验证轨道 + 分屏对比）">
              <div class="entry-icon">✎</div>
              <div><b>编辑会话</b><br><span>草稿 · 分屏对比 · 干涉</span></div>
            </button>
            <button class="entry-card" id="entry-drawing" title="打开图纸对照独立页">
              <div class="entry-icon">▣</div>
              <div><b>图纸对照</b><br><span>DXF / DWG 语义 + SVG</span></div>
            </button>
            <button class="entry-card" id="entry-report" title="体检报告中心（干涉 + DFM）">
              <div class="entry-icon">✓</div>
              <div><b>体检·分析</b><br><span>干涉 · DFM · 报告回链</span></div>
            </button>
          </div>
        </div>
        <div id="info-summary" class="info-summary"></div>
      </main>

      <!-- 浏览态：版本历史（临时 modal，报告中心再统一） -->
      <div id="versions-modal" class="hidden modal">
        <div class="card">
          <div class="fp-head">
            <span>版本历史</span>
            <button id="versions-close" title="关闭">×</button>
          </div>
          <div id="versions-body" style="padding:10px 12px"></div>
        </div>
      </div>

      <!-- 浏览态：特征查看（临时 modal，编辑会话再落地） -->
      <div id="feature-modal" class="hidden modal">
        <div class="card">
          <div class="fp-head">
            <span id="feature-title">特征</span>
            <button id="feature-close" title="关闭">×</button>
          </div>
          <div id="feature-body"></div>
        </div>
      </div>

      <!-- 浏览态：体检报告（临时 modal，报告中心再落地） -->
      <div id="audit-modal" class="hidden modal">
        <div class="card">
          <div class="fp-head">
            <span>体检报告</span>
            <button id="audit-close" title="关闭">×</button>
          </div>
          <div id="audit-body"></div>
        </div>
      </div>

      <!-- 浏览态：渲染结果 -->
      <div id="render-modal" class="hidden modal">
        <div class="card wide">
          <div class="fp-head">
            <span>离线渲染</span>
            <button id="render-close" title="关闭">×</button>
          </div>
          <div id="render-view"></div>
          <div id="render-meta"></div>
        </div>
      </div>

      <!-- 任务卡片（跨页共享） -->
      <div id="job-card" class="hidden">
        <div class="fp-head">
          <span id="job-title">任务</span>
          <button id="job-cancel" title="取消任务">×</button>
        </div>
        <div id="job-body">
          <div id="job-phase">排队中</div>
          <div id="job-bar"><div id="job-bar-fill"></div></div>
          <div id="job-detail"></div>
          <div id="job-result"></div>
        </div>
      </div>
    </div>

    <div id="drop-overlay" class="hidden">
      <div class="drop-msg">松开以加载文件（STEP / DXF / DWG）</div>
    </div>

  </body>
</html>

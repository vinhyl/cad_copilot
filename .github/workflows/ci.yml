name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: make_picker smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bootstrap venv + dependencies
        run: python bootstrap.py
        shell: bash

      - name: Smoke test make_picker on selftest.step
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" feature_picker.py selftest.step --out-dir previews
        shell: bash

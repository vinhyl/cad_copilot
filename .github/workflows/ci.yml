name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: make_picker smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Bootstrap venv + dependencies
        run: python bootstrap.py
        shell: bash

      - name: Smoke test make_picker on selftest.step
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" feature_picker.py selftest.step --out-dir previews
        shell: bash

      - name: Smoke test pick_features MCP tool
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -c "import cad_mcp_server, json, os; d=json.loads(cad_mcp_server.pick_features('selftest.step', out_dir='previews/_ci_mcp')); assert d['feature_count']>0 and os.path.exists(d['html']), 'pick_features failed'; print('pick_features OK ->', d['html'])"
        shell: bash

      - name: Install test dependencies (pytest + pytest-cov)
        # Test deps are intentionally NOT in runtime requirements.txt; install
        # them into the venv so the pytest.ini --cov options work on CI.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -m pip install pytest pytest-cov
        shell: bash

      - name: Run pytest test-suite (Phase 3 regression)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -m pytest tests/ -q
        shell: bash

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: toolchain smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Bootstrap venv + dependencies
        run: python bootstrap.py
        shell: bash

      # NOTE: the legacy `selftest.py` OCP read/properties/convert smoke is
      # retired — it is now covered by the pytest suite (tests/test_selftest_e2e.py,
      # run in the step below), which is the authoritative regression gate.
      - name: Smoke test pick_features MCP tool (structured)

      - name: Smoke test pick_features MCP tool (structured)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -c "import cad_mcp_server, json; d=json.loads(cad_mcp_server.pick_features('selftest.step')); assert d['feature_count']>0 and all('id' in f for f in d['features']), 'pick_features failed'; print('pick_features OK ->', d['feature_count'], 'features')"
        shell: bash

      - name: Install test dependencies (pytest + pytest-cov)
        # Test deps are intentionally NOT in runtime requirements.txt; install
        # them into the venv so the pytest.ini --cov options work on CI.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -m pip install pytest pytest-cov
        shell: bash

      - name: Run pytest test-suite (Phase 3 regression)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="venv/Scripts/python"; else PY="venv/bin/python"; fi
          "$PY" -m pytest tests/ -q
        shell: bash

  frontend-dist:
    name: frontend dist consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify frontend/dist matches src
        run: bash scripts/check-dist-sync.sh --strict
        shell: bash
